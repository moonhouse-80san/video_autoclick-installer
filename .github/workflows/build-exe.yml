name: Build Windows exe + Installer

on:
  workflow_dispatch: # GitHub 저장소의 Actions 탭에서 [Run workflow] 버튼으로 실행
  push:
    tags: ["v*"] # v2.0 같은 태그를 push해도 자동 실행

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build exe
        shell: cmd
        run: |
          if not exist "VideoAutoClick.spec" if exist "video_autoclick-master\VideoAutoClick.spec" copy /y "video_autoclick-master\VideoAutoClick.spec" "VideoAutoClick.spec"
          if not exist "VideoAutoClick.spec" (
            (
              echo # -*- mode: python ; coding: utf-8 -*-
              echo from PyInstaller.utils.hooks import collect_all, collect_submodules
              echo hiddenimports = collect_submodules('vac'^)
              echo datas, binaries = [], []
              echo for pkg in ('cv2', 'numpy', 'mss', 'pynput'^):
              echo     try:
              echo         d, b, h = collect_all(pkg^)
              echo         datas += d; binaries += b; hiddenimports += h
              echo     except Exception:
              echo         pass
              echo a = Analysis(['main.py'], pathex=['.'], binaries=binaries, datas=datas, hiddenimports=hiddenimports^)
              echo pyz = PYZ(a.pure^)
              echo exe = EXE(pyz, a.scripts, a.binaries, a.datas, [], name='VideoAutoClick', debug=False, strip=False, upx=True, console=False^)
            ) > VideoAutoClick.spec
          )
          python -m PyInstaller --noconfirm --clean VideoAutoClick.spec
          if not exist "dist\VideoAutoClick.exe" exit /b 1

      - name: Package (zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist\VideoAutoClick.exe package\
          Copy-Item -LiteralPath "사용설명서.txt" -Destination package\

      - uses: actions/upload-artifact@v4
        with:
          name: VideoAutoClick-win11
          path: package/*

      # ---- 설치 파일(Setup.exe) 자동 생성 추가 ----
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: cmd
        run: |
          if not exist "installer_output" mkdir "installer_output"
          "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /O"installer_output" installer\VideoAutoClick.iss

      - uses: actions/upload-artifact@v4
        with:
          name: VideoAutoClick-Setup
          path: installer_output/*.exe
